name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build src/RozdarteKrainy.Cli/RozdarteKrainy.Cli.csproj
      - run: dotnet test tests/RozdarteKrainy.Engine.Tests/RozdarteKrainy.Engine.Tests.csproj --logger "console;verbosity=normal"
      - run: dotnet run --project src/RozdarteKrainy.Cli -- --symulacja 300
